.bg-overlay{position:fixed;inset:0;background:rgba(8,0,22,0.60);z-index:1}
.container{position:relative;z-index:2;width:100%;max-width:500px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:12px}
.title{font-family:'Bangers',cursive;font-size:clamp(1.8rem,8vw,3rem);letter-spacing:3px;text-align:center;line-height:1;color:var(--yellow);text-shadow:0 0 10px var(--orange),3px 3px 0 #a00}
.title span{color:var(--pink);text-shadow:0 0 10px var(--pink),3px 3px 0 #700}
.status-bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
.player-card{flex:1;border-radius:14px;padding:8px 10px;text-align:center;border:2px solid transparent;transition:all .3s;backdrop-filter:blur(8px)}
.x-card{background:rgba(255,45,120,.15);border-color:var(--pink);box-shadow:0 0 14px rgba(255,45,120,.3)}
.o-card{background:rgba(0,207,255,.15);border-color:var(--blue);box-shadow:0 0 14px rgba(0,207,255,.3)}
.active.x-card{transform:scale(1.05);background:rgba(255,45,120,.32);box-shadow:0 0 32px rgba(255,45,120,.8)}
.active.o-card{transform:scale(1.05);background:rgba(0,207,255,.32);box-shadow:0 0 32px rgba(0,207,255,.8)}
.psym{font-family:'Bangers',cursive;font-size:1.9rem;line-height:1}
.x-card .psym{color:var(--pink);text-shadow:0 0 10px var(--pink)}
.o-card .psym{color:var(--blue);text-shadow:0 0 10px var(--blue)}
.plabel{font-size:.6rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:2px}
.sbadge{font-family:'Bangers',cursive;font-size:1.4rem;color:#fff}
.turn{font-size:.7rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--yellow);text-shadow:0 0 10px var(--yellow);text-align:center;min-width:65px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.board-wrap{position:relative;width:100%;max-width:310px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;background:rgba(0,0,0,.48);border-radius:18px;border:2px solid rgba(255,255,255,.1);backdrop-filter:blur(14px)}
.cell{aspect-ratio:1;border-radius:12px;border:2px solid rgba(255,255,255,.14);background:rgba(10,0,21,.55);display:flex;align-items:center;justify-content:center;font-family:'Bangers',cursive;font-size:clamp(2.2rem,9vw,3.2rem);cursor:pointer;transition:all .2s;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.cell:active:not(.taken){transform:scale(.93)}
.cell.taken{cursor:default}
.cell.x{color:var(--pink);text-shadow:0 0 18px var(--pink),0 0 35px var(--pink);border-color:rgba(255,45,120,.5);background:rgba(255,45,120,.1);animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
.cell.o{color:var(--blue);text-shadow:0 0 18px var(--blue),0 0 35px var(--blue);border-color:rgba(0,207,255,.5);background:rgba(0,207,255,.1);animation:popIn .3s cubic-bezier(.34,1.56,.64,1)}
.cell.x.winner{background:rgba(255,45,120,.4);border-color:var(--pink);box-shadow:0 0 25px var(--pink);animation:wPulse .5s ease forwards}
.cell.o.winner{background:rgba(0,207,255,.4);border-color:var(--blue);box-shadow:0 0 25px var(--blue);animation:wPulse .5s ease forwards}
@keyframes popIn{from{transform:scale(.3) rotate(-15deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes wPulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1.06)}}
.res-overlay{display:none;position:absolute;inset:0;border-radius:18px;background:rgba(5,0,20,.93);backdrop-filter:blur(8px);flex-direction:column;align-items:center;justify-content:center;gap:9px;z-index:10;animation:fadeIn .4s ease}
.res-overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
.res-emoji{font-size:2.8rem}
.res-txt{font-family:'Bangers',cursive;font-size:clamp(1.7rem,7vw,2.3rem);letter-spacing:2px;text-align:center;line-height:1.1}
.res-txt.xw{color:var(--pink);text-shadow:0 0 18px var(--pink)}
.res-txt.ow{color:var(--blue);text-shadow:0 0 18px var(--blue)}
.res-txt.dw{color:var(--yellow);text-shadow:0 0 18px var(--yellow)}
.res-sub{font-size:.72rem;font-weight:800;color:rgba(255,255,255,.55);letter-spacing:1px;text-transform:uppercase;text-align:center;padding:0 16px}
.punish{font-size:.85rem;font-weight:800;color:var(--yellow);text-shadow:0 0 8px var(--orange);text-align:center;padding:7px 16px;border-radius:28px;background:rgba(255,165,0,.14);border:1px solid rgba(255,165,0,.4)}
.btn-row{display:flex;gap:10px;width:100%;max-width:310px}
.btn{flex:1;padding:13px;border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:900;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:active{transform:scale(.95)}
.btn-n{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 4px 18px rgba(255,45,120,.4)}
.btn-r{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.18)}
.foot{font-size:.7rem;font-weight:800;color:rgba(255,255,255,.5);letter-spacing:1px;text-transform:uppercase}
#cfv{position:fixed;inset:0;pointer-events:none;z-index:200}
</style>
</head>
<body>
<div class="bg"></div>
<div class="bg-overlay"></div>
<canvas id="cfv"></canvas>
<div class="container">
  <div class="title"><span>XO</span> AMIGOS TOXICOS</div>
  <div class="status-bar">
    <div class="player-card x-card active" id="cx">
      <div class="psym">X</div>
      <div class="plabel">Jugador X</div>
      <div class="sbadge" id="sx">0</div>
    </div>
    <div class="turn" id="tur">TURNO X</div>
    <div class="player-card o-card" id="co">
      <div class="psym">O</div>
      <div class="plabel">Jugador O</div>
      <div class="sbadge" id="so">0</div>
    </div>
  </div>
  <div class="board-wrap">
    <div class="board">
      <div class="cell" data-i="0"></div><div class="cell" data-i="1"></div><div class="cell" data-i="2"></div>
      <div class="cell" data-i="3"></div><div class="cell" data-i="4"></div><div class="cell" data-i="5"></div>
      <div class="cell" data-i="6"></div><div class="cell" data-i="7"></div><div class="cell" data-i="8"></div>
    </div>
    <div class="res-overlay" id="ro">
      <div class="res-emoji" id="re">🎉</div>
      <div class="res-txt" id="rt"></div>
      <div class="res-sub" id="rs"></div>
      <div class="punish" id="rp"></div>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-n" onclick="nextRound()">&#9654; Nueva Ronda</button>
    <button class="btn btn-r" onclick="resetAll()">&#8635; Reiniciar</button>
  </div>
  <div class="foot">&#x1F943; Perdedor: 1 shot de tequila &#x1F943;</div>
</div>
<script>
var W=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
var bd=Array(9).fill(null),cur="X",sc={X:0,O:0},go=false;
var cells=document.querySelectorAll(".cell");
var ro=document.getElementById("ro"),rt=document.getElementById("rt"),re=document.getElementById("re"),rs=document.getElementById("rs"),rp=document.getElementById("rp");
var sx=document.getElementById("sx"),so=document.getElementById("so"),cx=document.getElementById("cx"),co=document.getElementById("co"),tur=document.getElementById("tur");
function upd(){cx.classList.toggle("active",cur==="X");co.classList.toggle("active",cur==="O");tur.textContent="TURNO "+cur}
function handleCell(c){
  var i=+c.dataset.i;if(bd[i]||go)return;
  bd[i]=cur;c.textContent=cur;c.classList.add("taken",cur.toLowerCase());
  var wl=chkW();
  if(wl){wl.forEach(function(j){cells[j].classList.add("winner")});go=true;sc[cur]++;sx.textContent=sc.X;so.textContent=sc.O;setTimeout(function(){show("win",cur)},400);conf();}
  else if(bd.every(Boolean)){go=true;setTimeout(function(){show("draw")},400);}
  else{cur=cur==="X"?"O":"X";upd();}
}
cells.forEach(function(c){
  c.addEventListener("touchstart",function(e){e.preventDefault();handleCell(c);},{passive:false});
  c.addEventListener("click",function(){handleCell(c);});
});
function chkW(){for(var i=0;i<W.length;i++){if(W[i].every(function(j){return bd[j]===cur}))return W[i]}return null}
function show(t,w){
  ro.classList.add("show");
  if(t==="win"){re.textContent="🎉";rt.className="res-txt "+(w==="X"?"xw":"ow");rt.textContent="Jugador "+w+" GANA!";rs.textContent="Jugador "+(w==="X"?"O":"X")+" pierde";rp.textContent="🥃 El perdedor toma 1 shot de tequila! 🥃";}
  else{re.textContent="🤝";rt.className="res-txt dw";rt.textContent="EMPATE!";rs.textContent="Se juega otra ronda";rp.textContent="🎲 El resto decide retos adicionales";}
}
function nextRound(){bd=Array(9).fill(null);go=false;ro.classList.remove("show");cells.forEach(function(c){c.textContent="";c.className="cell"});upd()}
function resetAll(){sc={X:0,O:0};sx.textContent="0";so.textContent="0";cur="X";nextRound()}
function conf(){
  var cv=document.getElementById("cfv"),ctx=cv.getContext("2d");
  cv.width=innerWidth;cv.height=innerHeight;
  var cl=["#ff2d78","#00cfff","#ffd700","#7b2fff","#ff6a00","#00ff99"];
  var ps=[];for(var i=0;i<110;i++)ps.push({x:Math.random()*cv.width,y:-15,r:Math.random()*7+3,c:cl[Math.floor(Math.random()*6)],ta:0,ts:Math.random()*.07+.05,sp:Math.random()*3+2});
  var fr=0;
  (function dr(){if(fr>210){ctx.clearRect(0,0,cv.width,cv.height);return}ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(function(p){p.ta+=p.ts;p.y+=p.sp;p.x+=Math.sin(p.ta)*2;ctx.beginPath();ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-fr/190);ctx.ellipse(p.x,p.y,p.r,p.r/2,Math.sin(p.ta)*12,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;fr++;requestAnimationFrame(dr)})();
}
upd();
